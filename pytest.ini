# Root pytest config for MORPHOS (added 2026-11-01).
#
# - testpaths: a bare `pytest` from the repo root collects only tests/, never
#   morphogen-v2/node_modules or stray scripts.
# - pythonpath: puts the repo root on sys.path, so `generative_codec` and
#   `bottleneck_train_sketch` import without the old `PYTHONPATH=.` prefix.
#   (The TD suites add morphogen-v2/td themselves.)
#
# Torch-dependent suites (test_shapes.py, test_train_sketch.py) call
# pytest.importorskip("torch") and are reported as skipped, not as collection
# errors, when torch isn't installed. tests/test_suite_layout.py keeps it so.
[pytest]
testpaths = tests
pythonpath = .
